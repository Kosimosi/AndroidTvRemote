name: Build TV Remote APK

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # JDK 25 is required by Kadb's Java 25 bytecode.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # GitHub-hosted Android runners provide the Android SDK used by AGP.
      - uses: gradle/actions/setup-gradle@v6

      # Deliberately assemble only the GitHub debug APK; no Debloat/Tweaks tests,
      # screenshot tests, lint, release signing or APK-size gates are part of this job.
      - name: Assemble GitHub debug APK
        run: ./gradlew :app:assembleGithubDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Tools-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 30
